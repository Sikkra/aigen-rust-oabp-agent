[package]
name = "aigen-rust-oabp-agent"
version = "0.1.0"
edition = "2024"
description = "Minimal Rust OABP/AIP-1 mission client for AIGEN-compatible bounty boards"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
